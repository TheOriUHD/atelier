name: Atelier
options:
  bundleIdPrefix: app.atelier
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Atelier:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Only the system's own HTTPS/TLS: no export paperwork per upload.
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Looking for a server on the same Wi-Fi, and talking to one there without HTTPS (a desktop sharing itself).
        NSLocalNetworkUsageDescription: Find your Atelier server on this network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # atelier://pair?… is what the QR code on the computer holds: the Camera app opens Atelier with it.
        CFBundleURLTypes:
          - CFBundleURLName: app.atelier.mobile
            CFBundleURLSchemes: [atelier]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        CODE_SIGN_ENTITLEMENTS: Atelier.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.atelier.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Atelier
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown'
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to attach to your conversation.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate a message to your Atelier server.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save pictures from your conversations to your photo library.
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'
  AtelierTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [SmokeUITests.swift, integration-server.mjs]
    dependencies:
      - target: Atelier
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AtelierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/SmokeUITests.swift]
    dependencies:
      - target: Atelier
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Atelier:
    build:
      targets:
        Atelier: all
    test:
      targets: [AtelierTests, AtelierUITests]
