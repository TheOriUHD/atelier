# The server image for self-hosting (docs/self-hosting.md), for x86-64 and ARM64. The release command builds and pushes
# it from the Linux build machine (deploy/ship/release.mjs); this workflow is the fallback, run by hand
# (Actions > Server image > Run workflow, with the version).
name: Server image
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build and tag the image as (for example v0.1.0)
        required: true
        type: string
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Image names must be lower case; the account name may not be.
      - run: echo "IMAGE=ghcr.io/${OWNER,,}/atelier" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-args: |
            ATELIER_VERSION=${{ env.VERSION }}
            ATELIER_IMAGE=${{ env.IMAGE }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
      # The chats' sandbox the compose file runs beside the server.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: sandbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-sandbox:${{ env.VERSION }}
            ${{ env.IMAGE }}-sandbox:latest
      # The optional updater service, which lets admins update the server from Settings › Admin › Server.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-updater:${{ env.VERSION }}
            ${{ env.IMAGE }}-updater:latest
